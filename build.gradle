plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
    id 'idea'
}

// Daisychain for Minecraft 1.20.1 + Forge (branch forge-1.20.1).
// Built with NeoForged's ModDevGradle "legacyforge" plugin, which supports MinecraftForge up to 1.20.1.

version = "${mod_version}+${minecraft_version}-forge"
group = mod_group_id

repositories {
    // JEI (optional integration).
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    // Mekanism, only for testing energy pipes in the dev game.
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    // FTB's and Architectury's mavens (step F26): FTB Ultimine for the optional add-on, plus FTB Library and Architectury
    // API so Ultimine runs in the dev game. Each maven is only asked for its own group.
    exclusiveContent {
        forRepository {
            maven {
                name = "FTB"
                url = "https://maven.ftb.dev/releases"
            }
        }
        filter {
            includeGroup "dev.ftb.mods"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Architectury"
                url = "https://maven.architectury.dev/"
            }
        }
        filter {
            includeGroup "dev.architectury"
        }
    }
    // Modrinth's maven: GuideME.
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

// Step F66: ./gradlew runClient -Pxenon_jar=<path to a xenon-...jar> also puts Xenon (an Embeddium fork: it replaces
// how chunks are drawn, like Sodium) in the dev game, to check facades and the wrench see-through view with it. Never a
// dependency of Daisychain. The jar's path is given on the command line, so no local path is written in this file.
// Step F68: ./gradlew runClient|runServer -Pdev_mods_dir=<folder> also loads every mod jar in that folder (other mods'
// release jars, e.g. Powah + Cloth Config for the Energizing Rod check). Never a dependency of Daisychain; the folder is
// given on the command line, so no local path is written in this file.
def devModsDir = project.findProperty('dev_mods_dir')
if (devModsDir) {
    repositories {
        exclusiveContent {
            forRepository {
                flatDir {
                    name = "DevModsLocal"
                    dirs file(devModsDir)
                }
            }
            filter {
                includeGroup "local.devmods"
            }
        }
    }
}

def xenonJar = project.findProperty('xenon_jar')
if (xenonJar) {
    repositories {
        exclusiveContent {
            forRepository {
                flatDir {
                    name = "XenonLocal"
                    dirs file(xenonJar).parentFile
                }
            }
            filter {
                includeGroup "local.xenon"
            }
        }
    }
}

base {
    archivesName = mod_id
}

// Step F49 (port of step 120): development-only code (game tests, stress tests, the test bench) lives in src/dev. It
// can use everything in src/main, is part of the mod in every run (runClient, runServer, runGameTestServer, IntelliJ),
// and is never put in the jar that players download (the jar is built from src/main only).
sourceSets {
    dev {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    devCompileClasspath.extendsFrom compileClasspath
    devRuntimeClasspath.extendsFrom runtimeClasspath
}

// Minecraft 1.20.1 runs on Java 17, so the mod must be Java 17 bytecode.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    validateAccessTransformers = true

    runs {
        client {
            client()
            programArguments.addAll '--width', '1920', '--height', '1080'
            // Step F66: -Pquick_play=<world folder in run/saves> opens that world straight away; -Pdev_shot=<name>
            // turns on the dev-only screenshot run (src/dev devclient/DevShot).
            if (project.hasProperty('quick_play')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quick_play').toString()
            }
            if (project.hasProperty('dev_shot')) {
                systemProperty 'daisychain.devShot', project.property('dev_shot').toString()
                if (project.hasProperty('dev_shot_views')) {
                    systemProperty 'daisychain.devShotViews', project.property('dev_shot_views').toString()
                }
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Step F25: runs every game test (src/dev/java/com/daisychain/gametest since F49) on a headless server, then exits.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            // Step F49: runs use the dev source set's classpath, so src/dev (tests, stress tools) is in the game too.
            sourceSet = sourceSets.dev
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.dev) // step F49: dev-only code is part of the mod in dev runs, never in the jar
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // GuideME: optional since the 2026-11-09 review (decision 5). It shows the in-game guide, which is plain data
    // files; no Daisychain code calls GuideME, so it is only put in the dev game, like JEI and Jade. To check that
    // everything still works without it:  ./gradlew runGameTestServer -Pwithout_guideme
    if (!project.hasProperty('without_guideme')) {
        modRuntimeOnly "maven.modrinth:guideme:${guideme_version}"
    }

    // JEI (optional): compile against its API only; the full JEI is only in the dev game.
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"

    // Jade (optional): pipe side info when you look at a pipe. Compile against it; in the dev game for testing.
    modCompileOnly "maven.modrinth:jade:${jade_version}"
    modRuntimeOnly "maven.modrinth:jade:${jade_version}"

    // spark profiler, only in the dev game, to measure stress tests. Never a dependency of Daisychain.
    modRuntimeOnly "maven.modrinth:spark:${spark_version}"

    // Mekanism + Generators, only so energy pipes can be tested in the dev game. Never a dependency of Daisychain.
    modRuntimeOnly "mekanism:Mekanism:${mekanism_version}"
    modRuntimeOnly "mekanism:Mekanism:${mekanism_version}:generators"
    // FTB Ultimine (step F26, optional): compile against it; in the dev game with FTB Library and Architectury API.
    // Never required: Daisychain only touches Ultimine when it's installed (Daisychain.java).
    modCompileOnly("dev.ftb.mods:ftb-ultimine-forge:${ultimine_version}") { transitive = false }
    modCompileOnly("dev.architectury:architectury-forge:${architectury_version}") { transitive = false }
    modRuntimeOnly("dev.ftb.mods:ftb-ultimine-forge:${ultimine_version}") { transitive = false }
    // Step F60: ./gradlew runClient -Pwith_ftbchunks also puts FTB Chunks and FTB Teams in the dev game, to check that
    // claims stop a mass facade click and a network paste. They need a newer FTB Library, which Ultimine accepts too.
    def withFtbChunks = project.hasProperty('with_ftbchunks')
    modRuntimeOnly("dev.ftb.mods:ftb-library-forge:${withFtbChunks ? ftbchunks_library_version : ftb_library_version}") { transitive = false }
    modRuntimeOnly("dev.architectury:architectury-forge:${architectury_version}") { transitive = false }
    if (withFtbChunks) {
        modRuntimeOnly("dev.ftb.mods:ftb-chunks-forge:${ftbchunks_version}") { transitive = false }
        modRuntimeOnly("dev.ftb.mods:ftb-teams-forge:${ftbteams_version}") { transitive = false }
    }
    // Step F66: Xenon in the dev game, only with -Pxenon_jar (see the repositories above).
    if (xenonJar) {
        modRuntimeOnly("local.xenon:${file(xenonJar).name - '.jar'}") { transitive = false }
    }
    if (devModsDir) {
        def devModsFolder = file(devModsDir)
        if (!devModsFolder.isDirectory()) {
            throw new GradleException("-Pdev_mods_dir: no such folder: ${devModsDir}")
        }
        devModsFolder.listFiles().findAll { it.name.endsWith('.jar') }.sort().each { jar ->
            modRuntimeOnly("local.devmods:${jar.name - '.jar'}") { transitive = false }
        }
    }
}

// Fill in mods.toml from gradle.properties.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            guideme_version_range  : guideme_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '2000'])
}

// Ship the MIT license inside the mod jar as LICENSE_<modid>.txt.
def licenseInJar = "LICENSE_${project.property('mod_id')}.txt"
tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE.txt')) {
        rename { String ignored -> licenseInJar }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
