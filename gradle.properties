org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
# Forge version the jar is built against (the oldest we support). Project Infinity runs 47.4.28.
# The dev game and CI's main build run on Project Infinity's Forge (FTB Ultimine 2001.1.8 needs 47.3+ to load);
# players can still use 47.2.0+ (forge_version_range), and CI also compiles against 47.2.0.
forge_version=47.4.28
forge_version_range=[47.2.0,)
loader_version_range=[47,)

mod_id=daisychain
mod_name=Daisychain
mod_license=MIT
mod_version=1.3.0
mod_group_id=com.daisychain

# GuideME: optional (review 2026-11-09, decision 5); shows the in-game guide (hold G over a Daisychain item).
guideme_version=20.1.15
guideme_version_range=[20.1.15,)

# JEI (optional integration)
jei_version=15.20.0.117

# Mekanism for testing energy pipes in the dev game only
mekanism_version=1.20.1-10.4.16.80

# Jade (optional integration: pipe side mode, upgrade and speed when you look at a pipe)
jade_version=11.13.3+forge

# spark profiler for measuring stress tests in the dev game only
spark_version=1.10.53-forge

# FTB Ultimine (step F26): optional add-on. 2001.1.8 = the version in Project Infinity (first 1.20.1 release with the
# right-click API). FTB Library and Architectury API only run in the dev game, at the versions it was built with.
ultimine_version=2001.1.8
ftb_library_version=2001.2.1
architectury_version=9.2.14
