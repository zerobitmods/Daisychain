org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# NeoForge used by the dev game and normal builds (Mekanism in the dev game needs 21.1.194+; step 79).
neo_version=21.1.265
# Oldest NeoForge 21.1 Daisychain supports (written into neoforge.mods.toml). Earlier than 21.1.49 is missing APIs we
# use (checked step 73). CI compiles against 21.1.49 on every push; build release jars with
# ./gradlew build -Pneo_version=21.1.49 so they are compiled against the oldest supported version.
neo_version_range=[21.1.49,)
loader_version_range=[1,)

mod_id=daisychain
mod_name=Daisychain
mod_license=MIT
mod_version=1.2.0
mod_group_id=com.daisychain

# JEI version used for the optional integration (step 28)
jei_version=19.21.2.313

# Mekanism for testing energy pipes in the dev game only (step 29a)
mekanism_version=1.21.1-10.7.19.85

# spark profiler for measuring stress tests in the dev game only (step 35)
spark_version=1.10.109-neoforge
# Pipez, only in the dev game to compare against (step 56). Never a dependency of Daisychain.
pipez_version=neoforge-1.21.1-1.2.31

# GuideME: optional (review 2026-11-09, decision 5); shows the in-game guide (hold G over a Daisychain item). Step 45.
guideme_version=21.1.17

# Jade (optional integration: pipe side mode, upgrade and speed when you look at a pipe)
jade_version=15.10.6+neoforge

# FTB Ultimine (step 98): optional add-on. 2101.1.15 = the version in ATM10 (the right-click API exists since 2101.1.2).
# FTB Library and Architectury API only run in the dev game, at the versions that Ultimine release was built with.
ultimine_version=2101.1.15
ftb_library_version=2101.1.28
architectury_version=13.0.6
