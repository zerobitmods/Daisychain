name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      # Step F25: the automatic game tests. A headless server runs every test and exits; the build fails if any fails.
      - name: Game tests
        # The server can end "successfully" without running anything (e.g. a mod failed to load), so also require the
        # "All N required tests passed" line.
        run: |
          set -o pipefail
          ./gradlew runGameTestServer 2>&1 | tee gametest.log
          grep -q "required tests passed" gametest.log

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          retention-days: 14

      # Release jar: built against the oldest Forge we support (Forge 47.2.0), so it only uses what that version has. This is
      # the jar that gets uploaded to Modrinth and CurseForge (artifact "release-jar").
      - name: Build release jar against oldest supported Forge 47.2.0
        run: ./gradlew clean build -Pforge_version=47.2.0

      - name: Upload release jar
        uses: actions/upload-artifact@v4
        with:
          name: release-jar
          path: build/libs/*.jar
          retention-days: 90
