name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      # Step 97: the automatic game tests (src/main/java/com/daisychain/gametest). A headless server runs every test and
      # exits; the build fails if any test fails.
      - name: Game tests
        # The server can end "successfully" without running anything (e.g. a mod failed to load), so also require the
        # "All N required tests passed" line.
        run: |
          set -o pipefail
          ./gradlew runGameTestServer 2>&1 | tee gametest.log
          grep -q "required tests passed" gametest.log

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          retention-days: 14

      # The dev game and normal builds use neo_version; this checks the code still compiles on the oldest
      # NeoForge we support (neo_version_range in gradle.properties).
      - name: Compile against oldest supported NeoForge 21.1
        run: ./gradlew compileJava -Pneo_version=21.1.49
