name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      # Step F25: the automatic game tests. A headless server runs every test and exits; the build fails if any fails.
      - name: Game tests
        # The server can end "successfully" without running anything (e.g. a mod failed to load), so also require the
        # "All N required tests passed" line.
        run: |
          set -o pipefail
          ./gradlew runGameTestServer 2>&1 | tee gametest.log
          grep -q "required tests passed" gametest.log

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          retention-days: 14

      # The dev game and the build above use Project Infinity's Forge (forge_version in gradle.properties). This checks the
      # code still compiles on the oldest Forge we support. Release jars: ./gradlew build -Pforge_version=47.2.0
      - name: Compile against oldest supported Forge 47.2.0
        run: ./gradlew compileJava -Pforge_version=47.2.0
